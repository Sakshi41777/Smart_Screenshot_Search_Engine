directories:
  output: dist
  buildResources: electron/resources
appId: com.smartshot.desktop
productName: Smart Screenshot Search Engine
files:
  - filter:
      - electron/**/*
      - client/build/**/*
  - from: app/dist/smartshot
    to: python
    filter:
      - '**/*'
asar: true
win:
  target: nsis
nsis:
  oneClick: false
  allowElevation: true
  perMachine: false
  allowToChangeInstallationDirectory: true
electronVersion: 25.9.8
